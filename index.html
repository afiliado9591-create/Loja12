<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loja Virtual & Plataforma de Moda Feminina</title>
  
  <!-- Configurações SEO e Google -->
  <meta name="google-site-verification" content="SEU_CODIGO_GOOGLE_SEARCH_CONSOLE" />
  <!-- Google Analytics GA4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-SEU_TRACKING_ID"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-SEU_TRACKING_ID');
  </script>

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Alpine.js (Framework Leve para Renderização Dinâmica) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

  <style>
    .font-grife { font-family: 'Playfair Display', Georgia, serif; }
    .aspect-product { aspect-ratio: 3 / 4; }
    [x-cloak] { display: none !important; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800 antialiased font-sans" x-data="lojaApp()">

  <!-- NAVBAR LIMPA E PROFISSIONAL -->
  <header class="sticky top-0 z-40 bg-white border-b border-gray-100 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      
      <!-- Logo e Nome da Loja -->
      <div class="flex items-center space-x-3 cursor-pointer" @click="painelAberto = false">
        <template x-if="config.logo">
          <img :src="config.logo" alt="Logo" class="h-10 w-auto object-contain">
        </template>
        <span class="text-xl font-bold tracking-tight text-gray-900 font-grife" x-text="config.nomeLoja"></span>
      </div>

      <!-- Menu de Ações (Apenas o Botão "Painel" e o Carrinho) -->
      <div class="flex items-center space-x-4">
        <!-- BOTÃO ÚNICO: PAINEL -->
        <button @click="abrirPainel()" class="flex items-center space-x-2 text-sm font-semibold text-gray-700 hover:text-black bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-full transition duration-200">
          <i class="fa-solid fa-user-circle text-lg text-rose-600"></i>
          <span>Painel</span>
        </button>

        <!-- Carrinho de Compras -->
        <button @click="carrinhoAberto = true" class="relative p-2 text-gray-700 hover:text-black transition">
          <i class="fa-solid fa-bag-shopping text-xl"></i>
          <span x-show="carrinho.length > 0" class="absolute -top-1 -right-1 bg-rose-500 text-white text-xs font-bold w-5 h-5 flex items-center justify-center rounded-full" x-text="carrinho.reduce((acc, item) => acc + item.qtd, 0)"></span>
        </button>
      </div>

    </div>
  </header>

  <!-- BANNER PRINCIPAL DA LOJA -->
  <section x-show="config.banner" class="relative w-full bg-gray-900 overflow-hidden">
    <img :src="config.banner" alt="Banner Principal" class="w-full h-48 md:h-80 object-cover opacity-85">
  </section>

  <!-- VITRINE DE PRODUTOS (COM TROCA DE LAYOUT: GRIFE x GRADE 2 PRODUTOS) -->
  <main class="max-w-7xl mx-auto px-4 py-8">
    <div :class="config.layoutGrife ? 'grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8' : 'grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4'">
      <template x-for="prod in produtos" :key="prod.id">
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col group hover:shadow-lg transition duration-300">
          
          <!-- Imagem do Produto com Voz do Navegador -->
          <div class="relative aspect-product bg-gray-100 overflow-hidden">
            <img :src="prod.imagem" :alt="prod.nome" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
            
            <!-- Botão: Ouvir Descrição -->
            <button @click="falarTexto(prod.nome + '. ' + prod.descricao)" class="absolute top-3 right-3 bg-black/60 hover:bg-black text-white p-2.5 rounded-full backdrop-blur-md transition shadow" title="Ouvir Descrição com Voz do Navegador">
              <i class="fa-solid fa-volume-high text-xs"></i>
            </button>
          </div>

          <!-- Dados do Produto -->
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-bold text-gray-900 text-base line-clamp-1" x-text="prod.nome"></h3>
              <p class="text-xs text-gray-500 mt-1 line-clamp-2" x-text="prod.descricao"></p>
            </div>

            <div class="mt-4">
              <div class="flex items-baseline space-x-2">
                <span class="text-xl font-extrabold text-gray-900" x-text="'R$ ' + prod.preco.toFixed(2)"></span>
              </div>

              <!-- Ações do Produto -->
              <div class="grid grid-cols-2 gap-2 mt-3">
                <!-- Chatbot IA de Guia de Tamanho -->
                <button @click="abrirChatbot(prod)" class="w-full py-2 bg-gray-100 hover:bg-gray-200 text-gray-800 text-xs font-semibold rounded-xl flex items-center justify-center space-x-1 transition">
                  <i class="fa-solid fa-comments text-rose-500"></i>
                  <span>Dúvidas</span>
                </button>

                <!-- Comprar -->
                <button @click="adicionarCarrinho(prod)" class="w-full py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-xl flex items-center justify-center space-x-1 shadow transition">
                  <i class="fa-solid fa-cart-plus"></i>
                  <span>Comprar</span>
                </button>
              </div>
            </div>
          </div>

        </div>
      </template>
    </div>
  </main>

  <!-- MODAL DO PAINEL UNIFICADO (CLIENTE / AFILIADO / ADMIN) -->
  <div x-show="painelAberto" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4" x-cloak>
    <div class="bg-white w-full max-w-4xl rounded-3xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      
      <!-- Cabeçalho do Painel -->
      <div class="p-5 bg-gray-900 text-white flex justify-between items-center">
        <div class="flex items-center space-x-3">
          <div class="w-10 h-10 rounded-full bg-rose-600/20 flex items-center justify-center text-rose-400">
            <i class="fa-solid fa-user-circle text-xl"></i>
          </div>
          <div>
            <h2 class="font-bold text-lg">Painel do Usuário</h2>
            <p class="text-xs text-gray-400" x-text="usuario.logado ? usuario.email : 'Acesse sua conta para continuar'"></p>
          </div>
        </div>
        <button @click="painelAberto = false" class="text-gray-400 hover:text-white p-2 transition"><i class="fa-solid fa-xmark text-2xl"></i></button>
      </div>

      <!-- Navegação por Abas no Painel -->
      <template x-if="usuario.logado">
        <div class="flex border-b border-gray-200 bg-gray-50 text-sm overflow-x-auto">
          <!-- Aba: Minhas Compras -->
          <button @click="abaPainel = 'compras'" :class="abaPainel === 'compras' ? 'border-b-2 border-rose-600 font-bold text-rose-600 bg-white' : 'text-gray-600 hover:text-gray-900'" class="px-6 py-4 whitespace-nowrap transition">
            <i class="fa-solid fa-bag-shopping mr-2"></i>Minhas Compras
          </button>

          <!-- Aba Dinâmica: Afiliar-se OU Área do Afiliado -->
          <button @click="abaPainel = 'afiliado'" :class="abaPainel === 'afiliado' ? 'border-b-2 border-rose-600 font-bold text-rose-600 bg-white' : 'text-gray-600 hover:text-gray-900'" class="px-6 py-4 whitespace-nowrap transition">
            <i class="fa-solid fa-handshake mr-2"></i>
            <span x-text="usuario.isAfiliado ? 'Área do Afiliado' : 'Afiliar-se'"></span>
          </button>

          <!-- Aba Exclusiva do Administrador (Apenas para jeanaguiar636@gmail.com) -->
          <template x-if="usuario.email === 'jeanaguiar636@gmail.com'">
            <button @click="abaPainel = 'admin'" :class="abaPainel === 'admin' ? 'border-b-2 border-rose-600 font-bold text-rose-600 bg-rose-50/50' : 'text-gray-600 hover:text-gray-900'" class="px-6 py-4 whitespace-nowrap transition">
              <i class="fa-solid fa-sliders mr-2 text-rose-600"></i>Painel do Administrador
            </button>
          </template>
        </div>
      </template>

      <!-- Conteúdo Interno do Painel -->
      <div class="p-6 overflow-y-auto flex-1">
        
        <!-- TELA DE LOGIN SIMPLES -->
        <div x-show="!usuario.logado" class="max-w-md mx-auto py-8">
          <div class="text-center mb-6">
            <i class="fa-solid fa-lock text-4xl text-rose-600 mb-2"></i>
            <h3 class="text-xl font-bold text-gray-900">Entrar no Seu Painel</h3>
            <p class="text-xs text-gray-500 mt-1">Digite seu e-mail para acompanhar suas compras e acessar o programa de afiliados.</p>
          </div>

          <form @submit.prevent="fazerLogin()" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Seu E-mail</label>
              <input type="email" x-model="usuario.email" required placeholder="seuemail@exemplo.com" class="w-full p-3.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-rose-500 outline-none">
            </div>
            <button type="submit" class="w-full py-3.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-lg transition">Acessar Painel</button>
          </form>
        </div>

        <!-- CONTEÚDO PARA USUÁRIOS LOGADOS -->
        <template x-if="usuario.logado">
          <div>

            <!-- ABA 1: MINHAS COMPRAS -->
            <div x-show="abaPainel === 'compras'" class="space-y-4">
              <h3 class="font-bold text-gray-900 text-lg">Histórico de Compras e Entregas</h3>
              
              <div class="bg-gray-50 border border-dashed border-gray-300 rounded-2xl p-8 text-center text-sm text-gray-500">
                <i class="fa-solid fa-box-open text-4xl mb-3 text-gray-400"></i>
                <p class="font-medium text-gray-700">Você ainda não realizou nenhuma compra.</p>
                <p class="text-xs text-gray-400 mt-1">Seus pedidos e códigos de rastreamento do SuperFrete/Correios aparecerão aqui.</p>
              </div>
            </div>

            <!-- ABA 2: PROGRAMA DE AFILIADOS (DINÂMICA) -->
            <div x-show="abaPainel === 'afiliado'" class="space-y-6">
              
              <!-- SE NÃO FOR AFILIADO: OPÇÃO DE AFILIAR-SE -->
              <div x-show="!usuario.isAfiliado" class="bg-rose-50 border border-rose-200 rounded-3xl p-8 text-center">
                <div class="w-16 h-16 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                  <i class="fa-solid fa-sack-dollar"></i>
                </div>
                <h3 class="text-2xl font-bold text-gray-900">Seja um Afiliado da Loja</h3>
                <p class="text-sm text-gray-600 mt-2 max-w-lg mx-auto">Divulgue nossos produtos de moda feminina e ganhe comissão por cada venda realizada através do seu link exclusivo de indicação.</p>

                <button @click="afiliarSe()" class="mt-6 px-8 py-4 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-2xl shadow-xl hover:shadow-2xl transition duration-200">
                  <i class="fa-solid fa-check-circle mr-2"></i>Quero Me Afiliar Agora
                </button>
              </div>

              <!-- SE JÁ FOR AFILIADO: PAINEL DE METRICAS E GANHOS -->
              <div x-show="usuario.isAfiliado" class="space-y-6">
                <!-- Cards de Métricas -->
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                  <div class="bg-emerald-50 border border-emerald-200 p-5 rounded-2xl">
                    <span class="text-xs font-semibold text-emerald-800 uppercase">Ganhos em Comissões</span>
                    <p class="text-2xl font-bold text-emerald-600 mt-1" x-text="'R$ ' + usuario.ganhosAfiliado.toFixed(2)"></p>
                  </div>
                  <div class="bg-blue-50 border border-blue-200 p-5 rounded-2xl">
                    <span class="text-xs font-semibold text-blue-800 uppercase">Vendas Realizadas</span>
                    <p class="text-2xl font-bold text-blue-600 mt-1" x-text="usuario.vendasAfiliado"></p>
                  </div>
                  <div class="bg-purple-50 border border-purple-200 p-5 rounded-2xl">
                    <span class="text-xs font-semibold text-purple-800 uppercase">Cliques no Seu Link</span>
                    <p class="text-2xl font-bold text-purple-600 mt-1" x-text="usuario.cliquesAfiliado"></p>
                  </div>
                </div>

                <!-- Campo de Link Exclusivo -->
                <div class="bg-gray-50 border p-5 rounded-2xl">
                  <label class="block text-xs font-semibold text-gray-600 uppercase mb-2">Seu Link Único de Divulgação</label>
                  <div class="flex space-x-2">
                    <input type="text" readonly :value="window.location.origin + '?ref=' + usuario.codigoAfiliado" class="w-full p-3 border rounded-xl bg-white text-sm font-mono text-gray-700">
                    <button @click="navigator.clipboard.writeText(window.location.origin + '?ref=' + usuario.codigoAfiliado); alert('Link de afiliado copiado!')" class="px-5 py-3 bg-gray-900 hover:bg-black text-white text-xs font-bold rounded-xl transition">Copiar</button>
                  </div>
                </div>
              </div>

            </div>

            <!-- ABA 3: PAINEL DE ADMINISTRAÇÃO (jeanaguiar636@gmail.com) -->
            <div x-show="abaPainel === 'admin'" class="space-y-6">
              <div class="border-b pb-3 flex justify-between items-center">
                <h3 class="font-bold text-gray-900 text-lg">Gerenciador da Loja Virtual</h3>
                <span class="bg-rose-100 text-rose-800 text-xs px-3 py-1 rounded-full font-bold">Modo Administrador</span>
              </div>
              
              <!-- Edição Visual e Banners -->
              <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Nome da Loja</label>
                  <input type="text" x-model="config.nomeLoja" class="w-full p-3 border rounded-xl text-sm">
                </div>
                <div>
                  <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">URL da Logo</label>
                  <input type="text" x-model="config.logo" placeholder="https://..." class="w-full p-3 border rounded-xl text-sm">
                </div>
              </div>

              <div>
                <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">URL do Banner Principal</label>
                <input type="text" x-model="config.banner" placeholder="https://..." class="w-full p-3 border rounded-xl text-sm">
              </div>

              <!-- Alternar Layout -->
              <div class="bg-gray-50 p-4 rounded-xl border flex items-center justify-between">
                <div>
                  <h4 class="text-sm font-bold text-gray-900">Layout Loja de Grife</h4>
                  <p class="text-xs text-gray-500">Ative para exibir em formato luxo (3 colunas) ou desative para a grade padrão de 2 produtos.</p>
                </div>
                <input type="checkbox" x-model="config.layoutGrife" class="w-6 h-6 text-rose-600 rounded cursor-pointer">
              </div>

              <!-- Gerenciador Simples de Produtos (Adicionar / Remover) -->
              <div class="border-t pt-4">
                <h4 class="font-bold text-sm mb-3">Cadastrar Novo Produto</h4>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                  <input type="text" x-model="novoProd.nome" placeholder="Nome do Produto" class="p-2.5 border rounded-lg text-xs">
                  <input type="number" x-model.number="novoProd.preco" placeholder="Preço (R$)" class="p-2.5 border rounded-lg text-xs">
                  <input type="text" x-model="novoProd.imagem" placeholder="URL da Imagem" class="p-2.5 border rounded-lg text-xs">
                </div>
                <button @click="adicionarProdutoAdmin()" class="mt-3 px-4 py-2 bg-gray-900 hover:bg-black text-white text-xs font-bold rounded-lg transition">Adicionar ao Catálogo</button>
              </div>

              <button @click="salvarConfiguracoes()" class="w-full py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow transition">Salvar Alterações da Loja</button>
            </div>

          </div>
        </template>

      </div>
    </div>
  </div>

  <!-- LÓGICA JAVASCRIPT LEVE (EXECUTA DIRETO NO NAVEGADOR / GITHUB PAGES) -->
  <script>
    function lojaApp() {
      return {
        painelAberto: false,
        carrinhoAberto: false,
        abaPainel: 'compras',
        
        // Perfil do Usuário
        usuario: {
          logado: false,
          email: '',
          isAfiliado: false,
          codigoAfiliado: '',
          ganhosAfiliado: 0,
          vendasAfiliado: 0,
          cliquesAfiliado: 0
        },

        // Configurações Gerais
        config: {
          nomeLoja: 'Dridalia Moda Feminina',
          logo: '',
          banner: 'https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1200',
          layoutGrife: true
        },

        // Formulário para Admin Adicionar Produto
        novoProd: { nome: '', preco: null, imagem: '', descricao: 'Produto exclusivo de alta qualidade.' },

        // Produtos em Destaque
        produtos: [
          { id: 1, nome: 'Conjunto Tati Moletinho Premium', preco: 189.90, descricao: 'Conjunto de moletinho super macio com modelagem elegante para o dia a dia.', imagem: 'https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?q=80&w=600' },
          { id: 2, nome: 'Vestido Midi Elegance Alfaiataria', preco: 239.90, descricao: 'Vestido midi de alfaiataria com corte impecável e caimento leve.', imagem: 'https://images.unsplash.com/photo-1539109136881-3be0616acf4b?q=80&w=600' }
        ],

        carrinho: [],

        init() {
          // Recupera configurações salvas
          const configSalva = localStorage.getItem('loja_config');
          if (configSalva) this.config = JSON.parse(configSalva);

          // Recupera produtos salvos pelo admin
          const prodsSalvos = localStorage.getItem('loja_produtos');
          if (prodsSalvos) this.produtos = JSON.parse(prodsSalvos);
        },

        abrirPainel() {
          this.painelAberto = true;
        },

        fazerLogin() {
          if (!this.usuario.email) return;
          this.usuario.logado = true;
          
          // Verifica no banco/storage se este usuário é afiliado
          const afiliadoSalvo = localStorage.getItem('afiliado_' + this.usuario.email);
          if (afiliadoSalvo) {
            const dados = JSON.parse(afiliadoSalvo);
            this.usuario.isAfiliado = true;
            this.usuario.codigoAfiliado = dados.codigo;
          }
        },

        afiliarSe() {
          const codigo = 'AF-' + Math.random().toString(36).substring(2, 7).toUpperCase();
          this.usuario.isAfiliado = true;
          this.usuario.codigoAfiliado = codigo;
          
          // Salva os dados de afiliado do e-mail
          localStorage.setItem('afiliado_' + this.usuario.email, JSON.stringify({
            codigo: codigo,
            email: this.usuario.email
          }));
          alert('Parabéns! Sua conta de afiliado foi ativada. Seu código é: ' + codigo);
        },

        adicionarProdutoAdmin() {
          if (!this.novoProd.nome || !this.novoProd.preco || !this.novoProd.imagem) {
            alert('Preencha o nome, preço e URL da imagem do produto.');
            return;
          }
          const produto = {
            id: Date.now(),
            nome: this.novoProd.nome,
            preco: Number(this.novoProd.preco),
            imagem: this.novoProd.imagem,
            descricao: this.novoProd.descricao
          };
          this.produtos.push(produto);
          localStorage.setItem('loja_produtos', JSON.stringify(this.produtos));
          this.novoProd = { nome: '', preco: null, imagem: '', descricao: 'Produto exclusivo de alta qualidade.' };
          alert('Produto cadastrado com sucesso!');
        },

        salvarConfiguracoes() {
          localStorage.setItem('loja_config', JSON.stringify(this.config));
          alert('Configurações salvas com sucesso!');
        },

        falarTexto(texto) {
          if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(texto);
            msg.lang = 'pt-BR';
            window.speechSynthesis.speak(msg);
          } else {
            alert('A síntese de voz não é suportada neste navegador.');
          }
        },

        abrirChatbot(prod) {
          alert('Assistente Virtual: Dúvidas sobre tamanho ou tecido do item "' + prod.nome + '"? Fale com nosso atendimento.');
        },

        adicionarCarrinho(prod) {
          this.carrinho.push({ ...prod, qtd: 1 });
          alert('Produto adicionado ao carrinho!');
        }
      }
    }
  </script>
</body>
</html>
