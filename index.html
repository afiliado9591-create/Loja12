<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatShop - Sua IA de Achadinhos e Afiliados</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col justify-between" x-data="chatShopApp()">

    <!-- CABEÇALHO -->
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-2 cursor-pointer" @click="resetSearch()">
                <div class="bg-indigo-600 text-white p-2.5 rounded-2xl font-bold text-xl shadow-sm">
                    <i class="fa-solid fa-store"></i>
                </div>
                <span class="text-xl font-bold tracking-tight text-gray-900">ChatShop <span class="text-indigo-600">Afiliados</span></span>
            </div>

            <!-- FILTROS DE PLATAFORMA NO TOPO -->
            <div class="flex flex-wrap items-center justify-center gap-2">
                <button @click="selectedPlatform = 'all'" :class="selectedPlatform === 'all' ? 'bg-gray-900 text-white shadow-sm' : 'bg-gray-100 text-gray-700 hover:bg-gray-200'" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition">Todos</button>
                <button @click="selectedPlatform = 'shopee'" :class="selectedPlatform === 'shopee' ? 'bg-red-600 text-white shadow-sm' : 'bg-red-50 text-red-600 hover:bg-red-100'" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition">Shopee</button>
                <button @click="selectedPlatform = 'mercadolivre'" :class="selectedPlatform === 'mercadolivre' ? 'bg-blue-600 text-white shadow-sm' : 'bg-blue-50 text-blue-600 hover:bg-blue-100'" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition">Mercado Livre</button>
                <button @click="selectedPlatform = 'shein'" :class="selectedPlatform === 'shein' ? 'bg-black text-white shadow-sm' : 'bg-gray-100 text-black hover:bg-gray-200'" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition">Shein</button>
                <button @click="selectedPlatform = 'amazon'" :class="selectedPlatform === 'amazon' ? 'bg-amber-600 text-white shadow-sm' : 'bg-amber-50 text-amber-700 hover:bg-amber-100'" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition">Amazon</button>
            </div>

            <!-- LINK PARA O PAINEL ADMIN -->
            <div>
                <a href="admin.html" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold px-4 py-2 rounded-xl transition flex items-center gap-1.5">
                    <i class="fa-solid fa-gauge"></i> Admin
                </a>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
        
        <!-- SEÇÃO DE PESQUISA (Limpa e Centralizada) -->
        <div class="text-center max-w-2xl mx-auto mb-10">
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-900 mb-3">O que você está procurando hoje?</h1>
            <p class="text-gray-500 mb-6 text-sm md:text-base">Pesquise por nome ou utilize o microfone para encontrar os melhores achadinhos.</p>
            
            <!-- BARRA DE PESQUISA + BOTÃO DE VOZ ESTILO WHATSAPP -->
            <div class="flex items-center bg-white border border-gray-200 rounded-full shadow-lg p-2 transition focus-within:ring-2 focus-within:ring-indigo-500">
                <span class="pl-4 text-gray-400"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" 
                       x-model="searchQuery" 
                       @keyup.enter="performSearch()" 
                       placeholder="Pesquise o produto aqui..." 
                       class="w-full px-4 py-2 text-gray-700 bg-transparent focus:outline-none text-base">
                
                <!-- Botão de Voz Estilo WhatsApp (Verde) -->
                <button @click="toggleVoiceSearch()" 
                        :class="isListening ? 'bg-red-500 animate-pulse' : 'bg-emerald-600 hover:bg-emerald-700'" 
                        class="text-white w-12 h-12 rounded-full flex items-center justify-center shadow-md transition shrink-0 ml-1"
                        title="Pesquisar por voz">
                    <i :class="isListening ? 'fa-solid fa-microphone-slash' : 'fa-solid fa-microphone'" class="text-lg"></i>
                </button>

                <!-- Botão de Enviar Texto -->
                <button @click="performSearch()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-full font-semibold transition ml-2 hidden sm:block shadow-sm">
                    Buscar
                </button>
            </div>

            <!-- Indicador de gravação de voz -->
            <div x-show="isListening" class="mt-3 text-emerald-600 text-sm font-medium animate-bounce">
                <i class="fa-solid fa-circle-dot mr-1"></i> Ouvindo... Fale o nome do produto.
            </div>
        </div>

        <!-- ESTADO INICIAL (Sem pesquisa efetuada) -->
        <template x-if="!hasSearched">
            <div class="text-center py-16 text-gray-400 border-2 border-dashed border-gray-200 rounded-3xl bg-white/50">
                <i class="fa-solid fa-bag-shopping text-5xl mb-3 text-gray-300"></i>
                <p class="text-base font-medium">Faça uma busca acima ou use a voz para encontrar produtos.</p>
            </div>
        </template>

        <!-- RESULTADOS DA PESQUISA -->
        <template x-if="hasSearched">
            <div>
                <!-- Resumo e feedback de voz -->
                <div class="flex items-center justify-between mb-6">
                    <p class="text-sm text-gray-600">
                        Encontrámos <span class="font-bold text-gray-900" x-text="filteredProducts.length"></span> produtos para "<span x-text="searchQuery" class="italic"></span>"
                    </p>
                    <button @click="speakResults()" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 px-3.5 py-2 rounded-xl font-medium transition flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-volume-high"></i> Ouvir Resumo
                    </button>
                </div>

                <!-- GRELHA DE PRODUTOS (Catálogo Dinâmico) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    <template x-for="product in paginatedProducts" :key="product.id">
                        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition flex flex-col justify-between">
                            <div>
                                <div class="relative h-48 bg-gray-100 overflow-hidden">
                                    <img :src="product.image" :alt="product.name" class="w-full h-full object-cover">
                                    <!-- Badge de Plataforma com cores corretas -->
                                    <span class="absolute top-3 left-3 px-2.5 py-1 rounded-full text-xs font-bold text-white uppercase shadow-sm"
                                          :class="{
                                              'bg-red-600': product.platform === 'shopee',
                                              'bg-blue-600': product.platform === 'mercadolivre',
                                              'bg-black': product.platform === 'shein',
                                              'bg-amber-600': product.platform === 'amazon'
                                          }"
                                          x-text="product.platform">
                                    </span>
                                </div>
                                <div class="p-4">
                                    <h3 class="font-semibold text-gray-800 text-sm mb-1 line-clamp-2" x-text="product.name"></h3>
                                    <p class="text-lg font-extrabold text-gray-900 mb-3" x-text="product.price"></p>
                                </div>
                            </div>
                            
                            <!-- Botão de Ação Dinâmico por Plataforma -->
                            <div class="p-4 pt-0">
                                <a :href="product.link" target="_blank" 
                                   class="w-full text-center py-2.5 px-4 rounded-xl font-bold text-white text-xs uppercase tracking-wide block transition shadow-sm"
                                   :class="{
                                       'bg-red-600 hover:bg-red-700': product.platform === 'shopee',
                                       'bg-blue-600 hover:bg-blue-700': product.platform === 'mercadolivre',
                                       'bg-black hover:bg-gray-800': product.platform === 'shein',
                                       'bg-amber-600 hover:bg-amber-700': product.platform === 'amazon'
                                   }">
                                    Ver Oferta <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i>
                                </a>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Caso não encontre produtos -->
                <div x-show="filteredProducts.length === 0" class="text-center py-12 text-gray-500 bg-white rounded-2xl border border-gray-100">
                    <i class="fa-regular fa-face-frown text-4xl mb-2 text-gray-400"></i>
                    <p class="font-medium">Nenhum produto encontrado com esse termo.</p>
                </div>

                <!-- BOTÃO "VER MAIS" (Paginação Inteligente) -->
                <div class="mt-8 text-center" x-show="currentPage < totalPages">
                    <button @click="loadMore()" class="bg-gray-900 hover:bg-gray-800 text-white font-semibold px-8 py-3 rounded-full text-sm transition shadow">
                        Ver mais produtos <i class="fa-solid fa-chevron-down ml-1"></i>
                    </button>
                </div>
            </div>
        </template>

    </main>

    <!-- RODAPÉ -->
    <footer class="bg-white border-t border-gray-100 py-6 text-center text-xs text-gray-400">
        <p>&copy; 2026 ChatShop Afiliados. Todos os direitos reservados.</p>
    </footer>

    <!-- SCRIPT DE LÓGICA (Alpine.js + Cloudflare D1 API) -->
    <script>
        function chatShopApp() {
            return {
                searchQuery: '',
                hasSearched: false,
                selectedPlatform: 'all',
                isListening: false,
                itemsPerPage: 15,
                displayLimit: 15,
                products: [],

                async init() {
                    // Carrega os produtos diretamente da base de dados Cloudflare D1 via Worker
                    try {
                        const res = await fetch('/api/products');
                        this.products = await res.json();
                    } catch (e) {
                        // Fallback de segurança caso a API demore a responder
                        this.products = [];
                    }
                },

                get filteredProducts() {
                    return this.products.filter(p => {
                        const query = this.searchQuery.toLowerCase();
                        // Procura no nome ou nas palavras-chave de SEO cadastradas pelo admin
                        const matchesName = p.name.toLowerCase().includes(query);
                        const matchesSEO = p.seo_keywords && p.seo_keywords.toLowerCase().includes(query);
                        const matchesSearch = query === '' || matchesName || matchesSEO;
                        const matchesPlatform = this.selectedPlatform === 'all' || p.platform === this.selectedPlatform;
                        return matchesSearch && matchesPlatform;
                    });
                },

                get paginatedProducts() {
                    return this.filteredProducts.slice(0, this.displayLimit);
                },

                get totalPages() {
                    return Math.ceil(this.filteredProducts.length / this.itemsPerPage);
                },

                get currentPage() {
                    return Math.ceil(this.displayLimit / this.itemsPerPage);
                },

                async performSearch() {
                    if (this.searchQuery.trim() !== '') {
                        this.hasSearched = true;
                        this.displayLimit = 15;
                        
                        // Regista a métrica de pesquisa no Worker em segundo plano
                        try {
                            await fetch(`/api/products?q=${encodeURIComponent(this.searchQuery)}`);
                        } catch (e) {}
                    }
                },

                resetSearch() {
                    this.searchQuery = '';
                    this.hasSearched = false;
                    this.selectedPlatform = 'all';
                },

                loadMore() {
                    this.displayLimit += 15;
                },

                // Pesquisa por Voz (Speech Recognition estilo WhatsApp)
                toggleVoiceSearch() {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SpeechRecognition) {
                        alert('O seu navegador não suporta pesquisa por voz.');
                        return;
                    }

                    if (this.isListening) return;

                    const recognition = new SpeechRecognition();
                    recognition.lang = 'pt-BR';
                    recognition.interimResults = false;
                    recognition.maxAlternatives = 1;

                    recognition.onstart = () => { this.isListening = true; };
                    recognition.onresult = (event) => {
                        const speechToText = event.results[0][0].transcript;
                        this.searchQuery = speechToText.replace(/\.$/, '');
                        this.isListening = false;
                        this.performSearch();
                        this.speakResults();
                    };
                    recognition.onerror = () => { this.isListening = false; };
                    recognition.onend = () => { this.isListening = false; };

                    recognition.start();
                },

                // Síntese de Voz (Text-to-Speech)
                speakResults() {
                    if ('speechSynthesis' in window) {
                        const count = this.filteredProducts.length;
                        const text = `Encontrei ${count} produtos para ${this.searchQuery}. Confira as ofertas na tela.`;
                        const utterance = new SpeechSynthesisUtterance(text);
                        utterance.lang = 'pt-BR';
                        window.speechSynthesis.speak(utterance);
                    }
                }
            }
        }
    </script>
</body>
  </html>
