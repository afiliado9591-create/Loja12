<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatShop & Dridalia Modas - Busca Inteligente</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .bg-marsala { background-color: #6b2d3c; }
        .text-marsala { color: #6b2d3c; }
        .border-marsala { border-color: #6b2d3c; }
        .hover\:bg-marsala-dark:hover { background-color: #55222f; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-between selection:bg-[#6b2d3c] selection:text-white" x-data="chatShopApp()">

    <!-- CABEÇALHO -->
    <header class="bg-white/90 backdrop-blur-md border-b border-slate-100 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer" @click="resetSearch()">
                <!-- Logo Dridalia Modas em Marsala -->
                <div class="bg-marsala text-white w-10 h-10 rounded-2xl flex items-center justify-center font-bold text-lg shadow-md">
                    <i class="fa-solid fa-shirt"></i>
                </div>
                <div>
                    <span class="text-lg font-extrabold tracking-tight text-slate-900 block leading-tight">ChatShop</span>
                    <span class="text-xs font-semibold text-marsala tracking-wide uppercase">Dridalia Modas</span>
                </div>
            </div>

            <!-- FILTROS DE PLATAFORMA NO TOPO -->
            <div class="hidden md:flex items-center gap-2 bg-slate-100/80 p-1 rounded-full border border-slate-200/60">
                <button @click="selectedPlatform = 'all'" :class="selectedPlatform === 'all' ? 'bg-slate-900 text-white shadow-sm' : 'text-slate-600 hover:text-slate-900'" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition">Todos</button>
                <button @click="selectedPlatform = 'shopee'" :class="selectedPlatform === 'shopee' ? 'bg-red-600 text-white shadow-sm' : 'text-slate-600 hover:text-red-600'" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition">Shopee</button>
                <button @click="selectedPlatform = 'mercadolivre'" :class="selectedPlatform === 'mercadolivre' ? 'bg-blue-600 text-white shadow-sm' : 'text-slate-600 hover:text-blue-600'" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition">Mercado Livre</button>
                <button @click="selectedPlatform = 'shein'" :class="selectedPlatform === 'shein' ? 'bg-black text-white shadow-sm' : 'text-slate-600 hover:text-black'" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition">Shein</button>
                <button @click="selectedPlatform = 'amazon'" :class="selectedPlatform === 'amazon' ? 'bg-amber-600 text-white shadow-sm' : 'text-slate-600 hover:text-amber-600'" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition">Amazon</button>
                <button @click="selectedPlatform = 'dridalia'" :class="selectedPlatform === 'dridalia' ? 'bg-marsala text-white shadow-sm' : 'text-slate-600 hover:text-marsala'" class="px-3.5 py-1.5 rounded-full text-xs font-semibold transition">Dridalia</button>
            </div>

            <!-- BOTÕES DO TOPO (ADMIN & CONTA) -->
            <div class="flex items-center gap-3">
                <a href="admin.html" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-bold px-3.5 py-2.5 rounded-xl transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-gauge"></i> <span class="hidden sm:inline">Painel Admin</span>
                </a>
                <button @click="showAccountModal = true" class="text-xs bg-slate-900 hover:bg-slate-800 text-white font-semibold px-4 py-2.5 rounded-xl transition shadow-sm flex items-center gap-2">
                    <i class="fa-regular fa-user text-marsala"></i> Minha Conta
                </button>
            </div>
        </div>
    </header>

    <!-- CONTEÚDO PRINCIPAL (PÁGINA DE PESQUISA) -->
    <main class="max-w-4xl mx-auto px-4 py-16 flex-grow w-full">
        
        <div class="text-center max-w-2xl mx-auto mb-12">
            <h1 class="text-4xl md:text-5xl font-extrabold text-slate-900 mb-4 tracking-tight">O que você deseja encontrar hoje?</h1>
            <p class="text-slate-500 mb-8 text-base font-medium">Pesquise por nome, categoria ou use o microfone por voz.</p>
            
            <!-- BARRA DE PESQUISA CENTRAL -->
            <div class="flex items-center bg-white border border-slate-200 rounded-2xl shadow-xl shadow-slate-100 p-2.5 transition focus-within:ring-2 focus-within:ring-[#6b2d3c]">
                <span class="pl-4 text-slate-400 text-lg"><i class="fa-solid fa-magnifying-glass"></i></span>
                <input type="text" 
                       x-model="searchQuery" 
                       @keyup.enter="performSearch()" 
                       placeholder="Pesquise o produto aqui..." 
                       class="w-full px-4 py-2 text-slate-700 bg-transparent focus:outline-none text-base font-medium">
                
                <!-- Botão Voz Estilo WhatsApp -->
                <button @click="toggleVoiceSearch()" 
                        :class="isListening ? 'bg-rose-500 animate-pulse' : 'bg-emerald-600 hover:bg-emerald-700'" 
                        class="text-white w-12 h-12 rounded-xl flex items-center justify-center shadow-md transition shrink-0 ml-1"
                        title="Pesquisar por voz">
                    <i :class="isListening ? 'fa-solid fa-microphone-slash' : 'fa-solid fa-microphone'" class="text-lg"></i>
                </button>

                <button @click="performSearch()" class="bg-marsala hover:bg-marsala-dark text-white px-6 py-3 rounded-xl font-semibold transition ml-2 hidden sm:block shadow-sm">
                    Buscar
                </button>
            </div>

            <div x-show="isListening" class="mt-4 text-emerald-600 text-sm font-semibold animate-bounce flex items-center justify-center gap-2">
                <i class="fa-solid fa-circle-dot"></i> Ouvindo... Fale agora.
            </div>
        </div>

        <!-- ESTADO INICIAL -->
        <template x-if="!hasSearched">
            <div class="text-center py-20 bg-white border border-slate-100 rounded-3xl shadow-sm">
                <div class="w-16 h-16 bg-rose-50 text-marsala rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                    <i class="fa-solid fa-bag-shopping"></i>
                </div>
                <h3 class="text-slate-800 font-bold text-lg mb-1">Catálogo Inteligente Pronto</h3>
                <p class="text-slate-400 text-sm">Digite o nome de um produto acima para começar as buscas.</p>
            </div>
        </template>

        <!-- RESULTADOS -->
        <template x-if="hasSearched">
            <div>
                <div class="flex items-center justify-between mb-8">
                    <p class="text-sm font-medium text-slate-600">
                        Encontrámos <span class="font-bold text-slate-900" x-text="filteredProducts.length"></span> produtos para "<span x-text="searchQuery" class="italic text-marsala"></span>"
                    </p>
                    <button @click="speakResults()" class="text-xs bg-rose-50 text-marsala hover:bg-rose-100 px-4 py-2 rounded-xl font-semibold transition flex items-center gap-2 shadow-sm">
                        <i class="fa-solid fa-volume-high"></i> Ouvir Resumo
                    </button>
                </div>

                <!-- GRELHA DE PRODUTOS -->
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    <template x-for="product in paginatedProducts" :key="product.id">
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-xl hover:-translate-y-1 transition duration-300 flex flex-col justify-between">
                            <div>
                                <div class="relative h-52 bg-slate-100 overflow-hidden">
                                    <img :src="product.image" :alt="product.name" class="w-full h-full object-cover">
                                    <span class="absolute top-3 left-3 px-3 py-1 rounded-full text-xs font-extrabold text-white uppercase shadow-md"
                                          :class="{
                                              'bg-red-600': product.platform === 'shopee',
                                              'bg-blue-600': product.platform === 'mercadolivre',
                                              'bg-black': product.platform === 'shein',
                                              'bg-amber-600': product.platform === 'amazon',
                                              'bg-marsala': product.platform === 'dridalia'
                                          }"
                                          x-text="product.platform">
                                    </span>
                                </div>
                                <div class="p-5">
                                    <h3 class="font-semibold text-slate-800 text-sm mb-2 line-clamp-2 leading-snug" x-text="product.name"></h3>
                                    <p class="text-lg font-extrabold text-slate-900 mb-4" x-text="product.price"></p>
                                </div>
                            </div>
                            
                            <div class="p-5 pt-0">
                                <a :href="product.link" target="_blank" 
                                   class="w-full text-center py-3 px-4 rounded-xl font-bold text-white text-xs uppercase tracking-wider block transition shadow-sm"
                                   :class="{
                                       'bg-red-600 hover:bg-red-700': product.platform === 'shopee',
                                       'bg-blue-600 hover:bg-blue-700': product.platform === 'mercadolivre',
                                       'bg-black hover:bg-slate-800': product.platform === 'shein',
                                       'bg-amber-600 hover:bg-amber-700': product.platform === 'amazon',
                                       'bg-marsala hover:bg-marsala-dark': product.platform === 'dridalia'
                                   }">
                                    Ver Oferta <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i>
                                </a>
                            </div>
                        </div>
                    </template>
                </div>

                <div x-show="filteredProducts.length === 0" class="text-center py-16 bg-white rounded-3xl border border-slate-100 text-slate-400">
                    <i class="fa-regular fa-face-frown text-4xl mb-3"></i>
                    <p class="font-medium text-slate-600">Nenhum produto encontrado com esse termo.</p>
                </div>

                <div class="mt-10 text-center" x-show="currentPage < totalPages">
                    <button @click="loadMore()" class="bg-slate-900 hover:bg-slate-800 text-white font-semibold px-8 py-3.5 rounded-full text-sm transition shadow-lg">
                        Carregar mais produtos <i class="fa-solid fa-chevron-down ml-1.5 text-xs"></i>
                    </button>
                </div>
            </div>
        </template>
    </main>

    <!-- MODAL "MINHA CONTA" / LOGIN -->
    <div x-show="showAccountModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4" x-cloak>
        <div @click.away="showAccountModal = false" class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-8 relative">
            <button @click="showAccountModal = false" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 text-lg"><i class="fa-solid fa-xmark"></i></button>
            
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-rose-50 text-marsala rounded-2xl flex items-center justify-center mx-auto mb-3 text-xl font-bold">
                    <i class="fa-solid fa-user-lock"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-900">Minha Conta</h3>
                <p class="text-slate-400 text-xs mt-1">Insira os seus dados de acesso ou credenciais de administrador.</p>
            </div>

            <form @submit.prevent="handleLogin()" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Email</label>
                    <input type="email" x-model="loginEmail" required placeholder="seu@email.com" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-[#6b2d3c] focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Palavra-passe</label>
                    <input type="password" x-model="loginPassword" required placeholder="••••••••" class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm focus:ring-2 focus:ring-[#6b2d3c] focus:outline-none">
                </div>
                <button type="submit" class="w-full bg-marsala hover:bg-marsala-dark text-white font-semibold py-3 rounded-xl text-sm transition shadow-md">
                    Entrar
                </button>
            </form>
        </div>
    </div>

    <!-- RODAPÉ -->
    <footer class="bg-white border-t border-slate-100 py-6 text-center text-xs text-slate-400">
        <p>&copy; 2026 ChatShop & Dridalia Modas. Todos os direitos reservados.</p>
    </footer>

    <!-- SCRIPT DE JAVASCRIPT EMBUTIDO -->
    <script>
        function chatShopApp() {
            return {
                searchQuery: '',
                hasSearched: false,
                selectedPlatform: 'all',
                isListening: false,
                itemsPerPage: 15,
                displayLimit: 15,
                products: [],
                showAccountModal: false,
                loginEmail: '',
                loginPassword: '',

                async init() {
                    try {
                        const res = await fetch('/api/products');
                        this.products = await res.json();
                    } catch (e) {
                        this.products = [];
                    }
                },

                get filteredProducts() {
                    return this.products.filter(p => {
                        const query = this.searchQuery.toLowerCase();
                        const matchesName = p.name.toLowerCase().includes(query);
                        const matchesSEO = p.seo_keywords && p.seo_keywords.toLowerCase().includes(query);
                        const matchesSearch = query === '' || matchesName || matchesSEO;
                        const matchesPlatform = this.selectedPlatform === 'all' || p.platform === this.selectedPlatform;
                        return matchesSearch && matchesPlatform;
                    });
                },

                get paginatedProducts() { return this.filteredProducts.slice(0, this.displayLimit); },
                get totalPages() { return Math.ceil(this.filteredProducts.length / this.itemsPerPage); },
                get currentPage() { return Math.ceil(this.displayLimit / this.itemsPerPage); },

                performSearch() {
                    if (this.searchQuery.trim() !== '') {
                        this.hasSearched = true;
                        this.displayLimit = 15;
                    }
                },

                resetSearch() {
                    this.searchQuery = '';
                    this.hasSearched = false;
                    this.selectedPlatform = 'all';
                },

                loadMore() { this.displayLimit += 15; },

                handleLogin() {
                    const email = this.loginEmail.trim().toLowerCase();
                    if (email === 'afiliado9591@gmail.com' || email.includes('admin')) {
                        this.showAccountModal = false;
                        window.location.replace('./admin.html');
                    } else {
                        alert('Login efetuado com sucesso! Bem-vindo.');
                        this.showAccountModal = false;
                    }
                },

                toggleVoiceSearch() {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    if (!SpeechRecognition) { alert('Voz não suportada.'); return; }
                    if (this.isListening) return;

                    const recognition = new SpeechRecognition();
                    recognition.lang = 'pt-BR';
                    recognition.onstart = () => { this.isListening = true; };
                    recognition.onresult = (event) => {
                        this.searchQuery = event.results[0][0].transcript.replace(/\.$/, '');
                        this.isListening = false;
                        this.performSearch();
                    };
                    recognition.onerror = () => { this.isListening = false; };
                    recognition.onend = () => { this.isListening = false; };
                    recognition.start();
                },

                speakResults() {
                    if ('speechSynthesis' in window) {
                        const utterance = new SpeechSynthesisUtterance(`Encontrei ${this.filteredProducts.length} produtos.`);
                        utterance.lang = 'pt-BR';
                        window.speechSynthesis.speak(utterance);
                    }
                }
            }
        }
    </script>
</body>
</html>
